<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Room to leave</title>
  <desc id="description">Five separate ink paths cross an open, rust-coloured threshold. Their beginnings are held lightly inside an unfinished room; their ends have space outside it. The room is not closed behind them. An original still composition about work ending without holding its workers, not live telemetry or a claim that a software repair has shipped.</desc>
