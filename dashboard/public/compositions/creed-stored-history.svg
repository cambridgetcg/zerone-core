<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">The space between records</title>
  <desc id="description">An abstract score for the creed composition. Three irregular dark stones rest far apart on a warm paper field. Three fine lines become one path, touching the stones without filling the spaces between them. The space is part of the work, not missing content. This is an artistic interpretation of recorded history, not a chart of a live blockchain.</desc>
