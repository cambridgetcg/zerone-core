<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Many voices, one measure</title>
  <desc id="description">Three groups of charcoal lines arrive with different rhythms. Each passes a small opening along one ochre measure, then continues as its own line. The measure is shared, not the voice. An original abstract score responding to consolidation in capture defense, not a graph of reputations, votes or live network data.</desc>
