<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(()=>{let value=location.hash;history.replaceState(history.state,"",location.pathname+location.search);Object.defineProperty(window,"__takeZeronePiCallbackFragment",{configurable:true,value:()=>{const captured=value;value="";delete window.__takeZeronePiCallbackFragment;return captured}})})();</script>
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Finishing Pi Sign-in · Zerone</title>
    <link rel="stylesheet" href="./callback.css" />
  </head>
  <body>
    <main aria-labelledby="callback-title">
      <span class="kicker">Optional Pi account pilot</span>
      <h1 id="callback-title">Sign-in could not be completed.</h1>
      <p id="callback-status" role="status" aria-live="polite">
        The private callback handoff did not complete in this page. Return to
        Zerone below; no Zerone account, wallet proof, contribution record,
        payment, qualification, or reward was created.
      </p>
      <noscript>
        <p class="callback-fallback">
          JavaScript is disabled, so this sign-in cannot complete. Use the
          return link to leave this callback address and its private URL
          fragment before starting again.
        </p>
      </noscript>
      <a id="callback-return" href="/#contribute">Return to Zerone</a>
    </main>
    <script type="module" src="/src/pi-callback.ts"></script>
  </body>
</html>
