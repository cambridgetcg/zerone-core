syntax = "proto3";

package zerone.work_creed.v1;

import "zerone/work_creed/v1/types.proto";

option go_package = "github.com/zerone-chain/zerone/x/work_creed/types";

// GenesisState is the x/work_creed genesis state. It is empty by default.
// A ceremony may explicitly add one version-1 pin per non-Knowledge phase.
message GenesisState {
  repeated PinnedSubCreed pinned_sub_creeds = 1;
}
