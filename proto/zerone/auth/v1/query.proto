syntax = "proto3";
package zerone.auth.v1;

option go_package = "github.com/zerone-chain/zerone/x/auth/types";

import "google/api/annotations.proto";
import "zerone/auth/v1/types.proto";
import "zerone/auth/v1/genesis.proto";

// Query defines the gRPC query service for the auth module.
service Query {
  // Account returns a Zerone account by bech32 address.
  rpc Account(QueryAccountRequest) returns (QueryAccountResponse) {
    option (google.api.http).get = "/zerone/auth/v1/account/{address}";
  }

  // AccountByDID returns a Zerone account by DID.
  rpc AccountByDID(QueryAccountByDIDRequest) returns (QueryAccountByDIDResponse) {
    option (google.api.http).get = "/zerone/auth/v1/account_by_did/{did}";
  }

  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/zerone/auth/v1/params";
  }

  // FrozenAccounts returns all frozen accounts.
  rpc FrozenAccounts(QueryFrozenAccountsRequest) returns (QueryFrozenAccountsResponse) {
    option (google.api.http).get = "/zerone/auth/v1/frozen_accounts";
  }

  // AccountIdentifier returns a chain-qualified, CAIP-10-syntax identifier
  // when a registered account's stored address is canonical lowercase,
  // 20-byte zrn Bech32. Otherwise-consistent historical or genesis-injected
  // records outside that projection return FailedPrecondition. The Cosmos
  // namespace address profile is still Draft and does not yet name the zrn
  // HRP. The DID is returned as Zerone-native metadata; this query does not
  // assert W3C DID conformance.
  rpc AccountIdentifier(QueryAccountIdentifierRequest) returns (QueryAccountIdentifierResponse) {
    option (google.api.http).get = "/zerone/auth/v1/account_identifier/{address}";
  }
}

message QueryAccountRequest {
  string address = 1;
}

message QueryAccountResponse {
  Account account = 1;
}

message QueryAccountByDIDRequest {
  string did = 1;
}

message QueryAccountByDIDResponse {
  Account account = 1;
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1;
}

message QueryFrozenAccountsRequest {}

message QueryFrozenAccountsResponse {
  repeated Account accounts = 1;
}

message QueryAccountIdentifierRequest {
  string address = 1;
}

message QueryAccountIdentifierResponse {
  ChainAccountIdentifier identifier = 1;
}

// ChainAccountIdentifier is an interoperability projection of an existing,
// canonical lowercase 20-byte Zerone account. It is computed from the current
// chain ID and account record and is never stored in consensus state.
message ChainAccountIdentifier {
  // CAIP-2 namespace. Always "cosmos" for Zerone.
  string namespace = 1;
  // Cosmos CAIP-2 reference: the native chain ID or its hashed fallback.
  string reference = 2;
  // Native chain ID from the query context.
  string raw_chain_id = 3;
  // CAIP-10-syntax account ID: cosmos:<reference>:<address>.
  string account_id = 4;
  // Canonical Zerone bech32 account address.
  string address = 5;
  // Existing Zerone-native did:zrn label; opaque to CAIP consumers.
  string did = 6;
  string account_type = 7;
  bool frozen = 8;
  uint64 created_at_block = 9;
}
