syntax = "proto3";

package zerone.schedule.v2;

option go_package = "github.com/zerone-chain/zerone/x/schedule/types";

import "zerone/schedule/v2/state.proto";

message GenesisState {
  Params params = 1;
  repeated Schedule schedules = 2;
  repeated ExecutionReceipt receipts = 3;
  uint64 next_schedule_id = 4;
  string total_escrow_uzrn = 5;
}
