syntax = "proto3";
package zerone.creed.v1;
option go_package = "github.com/zerone-chain/zerone/x/creed/types";

import "cosmos/msg/v1/msg.proto";
import "zerone/creed/v1/types.proto";
import "zerone/creed/v1/genesis.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // AnchorPin records a new PinnedCreed at version+1 through the configured
  // authority. The application uses the gov module account, but while direct
  // anchoring is enabled this handler does not prove LIP passage.
  //
  // The handler refuses if direct_anchor_enabled is false, if the version
  // is not strictly greater than
  // the current pin, if the canonical_hash is empty, or if the
  // commitment registry breaks structural invariants (duplicate
  // numbers, gaps that don't match an archive transition).
  rpc AnchorPin(MsgAnchorPin) returns (MsgAnchorPinResponse);

  // UpdateParams is the standard authority-gated param update.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateCouncilMember adds, updates, or deactivates a single
  // Creed Council registry entry. Authority-gated. The council is a future
  // two-pool tally surface; current LIP tally does not consume it.
  rpc UpdateCouncilMember(MsgUpdateCouncilMember) returns (MsgUpdateCouncilMemberResponse);
}

message MsgAnchorPin {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;

  // The new pinned creed. version MUST equal currentPin.version+1.
  // canonical_hash MUST be exactly 32 bytes. commitments MUST satisfy:
  //   - all numbers unique
  //   - numbers are 1..N for some N; archived entries remain present
  //   - introduced_at_height ≤ block_height for all entries
  PinnedCreed pin = 2;

  // Optional source LIP id. The public AnchorPin handler is entirely sealed
  // when direct_anchor_enabled=false. While enabled, this may be empty for
  // any authority-direct pin, including after genesis.
  string source_lip = 3;
}
message MsgAnchorPinResponse {
  uint32 new_version = 1;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}
message MsgUpdateParamsResponse {}

message MsgUpdateCouncilMember {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;

  // The seat to upsert. address is the key; existing seats with
  // the same address are updated in place (their admitted_at_height
  // is preserved if unchanged).
  CreedCouncilMember member = 2;

  // Claimed source LIP id. Required by this handler when
  // direct_anchor_enabled=false, but the handler does not itself verify LIP
  // passage. While direct anchoring is enabled this may be empty.
  string source_lip = 3;
}
message MsgUpdateCouncilMemberResponse {}
