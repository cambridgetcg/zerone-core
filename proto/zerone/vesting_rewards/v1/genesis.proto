syntax = "proto3";
package zerone.vesting_rewards.v1;

option go_package = "github.com/zerone-chain/zerone/x/vesting_rewards/types";

import "zerone/vesting_rewards/v1/state.proto";
import "zerone/common/v1/common.proto";

// GenesisState defines the vesting_rewards module's genesis state.
message GenesisState {
  Params                       params            = 1;
  repeated CategoryConfig      category_configs   = 2;
  repeated VestingSchedule     vesting_schedules  = 3;
  repeated ClawbackRecord      clawback_records   = 4;
  repeated BlockRewardDistribution block_reward_distributions = 5;
  repeated ClaimScheduleIndex  claim_schedule_indexes = 6;
}

// Params defines the vesting_rewards module parameters.
message Params {
  // Block rewards
  string block_reward = 1;                           // base block reward in uzrn (default: "10000000" = 10 ZRN)
  uint64 reward_decay_bps = 2;                       // per-epoch decay (default: 994,478 = 0.994478x on 1M scale)
  uint64 blocks_per_reward_epoch = 3;                // blocks per decay epoch (default: 100,000)

  // Revenue split (governance-adjustable)
  zerone.common.v1.RevenueSplit revenue_split = 4;
  zerone.common.v1.ProtocolSubSplit protocol_sub_split = 5;

  // Compatibility-only founder fields. The tap is constitutionally renounced:
  // source validation requires 0/empty and governance cannot restore it.
  uint64 founder_share_bps = 6;
  string founder_address = 7;
  uint64 governance_activation_height = 8;           // DEPRECATED — retained for wire compatibility; not an activation gate

  // Compatibility-only declarations. Current reward execution does not read
  // these entries; runtime updates must preserve them.
  repeated CategoryRewardConfig category_reward_configs = 9;

  // Compatibility-only. Runtime routes to the compiled research_fund module
  // account and rejects changing this field.
  string research_fund_module_account = 10;

  // Vesting parameters
  // Compatibility-only: not an execution gate; runtime updates must preserve it.
  bool   vesting_enabled = 11;
  uint64 released_clawback_rate = 12;                // 10,000 scale: default 3300 = 33% of released value
  uint32 min_validators_for_full_reward = 13;        // target validator count for full block reward (default: 22)
  uint64 empty_block_reward_rate = 14;               // 10,000 scale: 10,000 = 100%; default 0
  string floor_reward = 15;                          // minimum reward per block in uzrn (default: "100000" = 0.1 ZRN)
  // Genesis/import-export TotalMinted bookkeeping only; runtime updates must
  // preserve it and it is not a spendable fund balance.
  string initial_fund_balance = 16;

  // Survived-challenge-coupled block reward.
  // When enabled, block reward is multiplied by clamp(rate/target, floor, 1.0).
  // Rate = survived / (survived + disproven); unchallenged facts are excluded.
  // Below target → reward is reduced; at target → full reward.
  // 0 target = disabled (backward compat).
  uint64 knowledge_coupling_target_bps = 17;          // target survived-challenge rate in BPS (default: 700,000 = 70%)
  uint64 knowledge_coupling_floor_bps = 18;           // minimum reward multiplier in BPS (default: 500,000 = 50%)
}

// CategoryRewardConfig defines a per-category block reward multiplier.
message CategoryRewardConfig {
  string category = 1;                               // epistemic category name
  uint64 multiplier_bps = 2;                         // 1,000,000 = 1.0x
}
