syntax = "proto3";
package zerone.training_provenance.v1;

option go_package = "github.com/zerone-chain/zerone/x/training_provenance/types";

// ProvenanceCertificate bundles the signals currently synthesized for a
// training manifest into a single queryable shape. Pure synthesis: this
// module owns no state — it reads from x/knowledge (manifest,
// privileged-action log, incidents), x/qualification (verifier metrics), and
// x/capture_challenge (cartel resolutions touching directly covered domains).
// For a composed manifest, fact/domain fields describe the child's stored
// delta; callers that need recursively materialized parent coverage must use
// the knowledge bundle APIs. The in-toto predicate v1 therefore refuses
// composed manifests.
//
// Trust grade is computed from the underlying signals — not stored. A
// re-query at a later height yields a possibly-different grade if more
// incidents have landed. The certificate is a current statement, not a
// historical artefact.
message ProvenanceCertificate {
  // ── Manifest identity ──────────────────────────────────────────────
  string manifest_id            = 1;
  string pipeline_id            = 2;
  string merkle_root            = 3;
  uint64 fact_count             = 4;
  uint64 finalized_at_block     = 5;
  string status                 = 6; // FINALIZED / ATTESTED / SUPERSEDED / etc.

  // ── Domain coverage ────────────────────────────────────────────────
  // One entry per domain represented in the manifest's directly stored fact
  // IDs. For composed manifests this is the child delta, not inherited facts.
  repeated DomainCoverage domains = 7;

  // ── Audit history (signals the chain has accumulated) ───────────────
  // Privileged-action records whose target exactly matches one of the
  // manifest's directly stored fact IDs.
  uint32 privileged_action_count = 8;
  // Incident records whose affected_modules contains "knowledge". This is a
  // conservative module-global signal, not a pipeline/domain-specific count.
  uint32 incident_count          = 9;
  // Capture-challenge resolutions (UPHELD only) targeting any of the
  // directly covered domains.
  uint32 cartel_resolution_count = 10;

  // ── Synthesised grade ──────────────────────────────────────────────
  // Letter grade based on the signals above. Scoring rubric is fixed in
  // code (deterministic) but the inputs evolve with chain state, so the
  // grade is current, not historical. See keeper.go for thresholds.
  string trust_grade            = 11;
  string trust_explanation      = 12;
  uint64 computed_at_block      = 13;
  // Chain on which the training manifest was originally snapshotted. This is
  // copied from TrainingManifest.chain_id rather than inferred from the node
  // currently answering the query, so export/import or relaunches preserve
  // provenance.
  string source_chain_id        = 14;
}

// DomainCoverage summarises one domain's contribution to a manifest.
message DomainCoverage {
  string domain                = 1;
  uint64 fact_count            = 2;
  // Average qualification weight across all currently-ACTIVE qualified
  // validators in this domain. Composes with the per-domain panel
  // weighting that adjudicated the manifest's facts.
  uint64 avg_qualified_weight  = 3;
  // Number of validators with ACTIVE qualifications in this domain.
  uint32 active_voter_count    = 4;
}

// ProvenanceCertificateV2 is the certificate of training-provenance predicate
// v2 (docs/specs/attestations/training-provenance-v2.md). It carries two
// separate readings and no combined letter:
//
//   - a warning reading: the v1 rubric and wording, unchanged, under names
//     that say what it counts. It is not evidence of review.
//   - a review reading: how many directly included fact IDs have a retained
//     verification round with at least one revealed vote.
//
// Fields 1-10, 13 and 14 have exactly the meanings of the same-numbered
// ProvenanceCertificate fields. Like v1, it is computed live and not stored.
message ProvenanceCertificateV2 {
  // ── Manifest identity ──────────────────────────────────────────────
  string manifest_id            = 1;
  string pipeline_id            = 2;
  string merkle_root            = 3;
  uint64 fact_count             = 4;
  uint64 finalized_at_block     = 5;
  string status                 = 6;

  // ── Domain coverage ────────────────────────────────────────────────
  repeated DomainCoverage domains = 7;

  // ── Audit history (the three counted warning signals) ──────────────
  uint32 privileged_action_count = 8;
  uint32 incident_count          = 9;
  uint32 cartel_resolution_count = 10;

  // ── Warning reading ────────────────────────────────────────────────
  // The v1 rubric (computeTrustGrade in
  // x/training_provenance/keeper/certificate.go) applied to fields 8-10:
  // "A", "B", "C" or "F". It says which counted warning signals are present.
  // It must not be read as review: "A" means none of the three signals is
  // present, not that any included fact was reviewed.
  string warning_grade          = 11;
  string warning_explanation    = 12;
  uint64 computed_at_block      = 13;
  string source_chain_id        = 14;

  // ── Review reading ─────────────────────────────────────────────────
  // Counted per entry of the manifest's directly included fact IDs.
  // reviewed_fact_count + unreviewed_fact_count == fact_count.
  //
  // A fact is reviewed when it exists, has a non-empty claim_id, and the
  // knowledge module still returns that claim's verification round, naming
  // the same claim, with at least one reveal. Every other entry is
  // unreviewed, including fact IDs missing from the store: the worst
  // reading wins.
  uint64 reviewed_fact_count    = 15;
  uint64 unreviewed_fact_count  = 16;
  // Unreviewed facts that exist, have an empty claim_id, and carry the
  // "doctrine" category or the "doctrine_authorship" method. Reported so
  // that doctrine is described, not graded.
  uint64 doctrine_fact_count    = 17;
  // Included fact IDs with no fact in the store. Counted as unreviewed.
  uint64 missing_fact_count     = 18;
  // "reviewed" (at least one fact, none unreviewed), "partly_reviewed"
  // (some of each), "unreviewed" (at least one fact, none reviewed) or
  // "empty" (no facts).
  string review_state           = 19;
  // One deterministic sentence built from the review counts.
  string review_explanation     = 20;
}
