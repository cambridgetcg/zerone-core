syntax = "proto3";
package zerone.training_provenance.v1;

option go_package = "github.com/zerone-chain/zerone/x/training_provenance/types";

import "google/api/annotations.proto";
import "zerone/training_provenance/v1/intoto.proto";
import "zerone/training_provenance/v1/types.proto";

// Query exposes live provenance views for a given manifest. The module owns no
// state of its own; each view is computed live from x/knowledge +
// x/qualification + x/capture_challenge.
//
// docs/TRUTH_SEEKING.md, commitment 11 (trust is queryable): a
// training manifest's trustworthiness — fact survival, validator
// calibration, capture posture — must be readable as a single
// composite, not reconstructed by an external auditor stitching
// upstream signals together. The certificate IS that single read.
service Query {
  rpc ProvenanceCertificate(QueryProvenanceCertificateRequest) returns (QueryProvenanceCertificateResponse) {
    option (google.api.http).get = "/zerone/training_provenance/v1/certificate/{manifest_id}";
  }

  // InTotoStatement projects the same live certificate into an unsigned
  // in-toto Statement v1. Returning the statement directly (rather than
  // wrapping it in a response message) keeps the HTTP JSON interoperable with
  // DSSE/Sigstore tooling. Predicate v1 accepts only non-composed manifests in
  // FINALIZED, ATTESTED, or SUPERSEDED status.
  rpc InTotoStatement(QueryInTotoStatementRequest) returns (InTotoStatementV1) {
    option (google.api.http).get = "/zerone/training_provenance/v1/in-toto/{manifest_id}";
  }
}

message QueryProvenanceCertificateRequest {
  string manifest_id = 1;
}

message QueryProvenanceCertificateResponse {
  ProvenanceCertificate certificate = 1;
}

message QueryInTotoStatementRequest {
  string manifest_id = 1;
}
