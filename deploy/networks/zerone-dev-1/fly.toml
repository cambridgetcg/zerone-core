app = "zerone-dev-1"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "zerone_dev_1_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 24
    hard_limit = 32

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/healthz"

[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 26656

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
