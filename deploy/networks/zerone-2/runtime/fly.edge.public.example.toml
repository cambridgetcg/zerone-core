# OPEN-BETA-only example. Do not use before the main-key OPEN-BETA decision and
# verified on-time history-link initiation evidence.
# Replace every `replace-*` value outside Git. Only direct P2P is public here.
# RPC, REST, and gRPC must be reached through a separate private-network
# TLS/per-client-rate-limit/query gateway; never add them as direct services.
app = "replace-edge-app"
primary_region = "replace-region"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "replace-with-pinned-image-digest"

[deploy]
  strategy = "immediate"

[env]
  NODE_ROLE = "edge"
  ZERONE_HOME = "/data/.zeroned"
  MONIKER = "replace-edge-moniker"
  PERSISTENT_PEERS = "0000000000000000000000000000000000000000@[replace-private-validator-address]:26656"
  PRIVATE_PEER_IDS = "0000000000000000000000000000000000000000"
  P2P_EXTERNAL_ADDRESS = "replace-public-edge-address:26656"
  CORS_ALLOWED_ORIGINS_JSON = "[]"
  QUERY_ORIGIN_ENABLED = "true"

[mounts]
  source = "replace_edge_volume"
  destination = "/data"

[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [services.concurrency]
    type = "connections"
    soft_limit = 80
    hard_limit = 120
  [[services.ports]]
    port = 26656
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "replace-edge-vm-size"
  memory = "4gb"

# P2P connection bounds are not query-abuse limits. Only OPEN-BETA plus its
# initiation evidence authorizes this switch; it does not waive the gateway.
