# Example only. Replace every `replace-*` value outside Git before use.
# This app has no public services and therefore receives no public Fly IP.
app = "replace-validator-app"
primary_region = "replace-region"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "replace-with-pinned-image-digest"

[deploy]
  # A validator volume and signer must never overlap on two machines.
  strategy = "immediate"

[env]
  NODE_ROLE = "validator"
  ZERONE_HOME = "/data/.zeroned"
  MONIKER = "replace-validator-moniker"
  QUERY_ORIGIN_ENABLED = "false"
  PERSISTENT_PEERS = "0000000000000000000000000000000000000000@[replace-private-edge-address]:26656"
  PRIVATE_PEER_IDS = "0000000000000000000000000000000000000000"

[mounts]
  source = "replace_validator_volume"
  destination = "/data"

[[vm]]
  size = "replace-validator-vm-size"
  memory = "4gb"

# Intentionally absent: [[services]], [http_service], public RPC/API/gRPC,
# public P2P, and all custody values. Bootstrap keys are one-time Fly secrets,
# never TOML entries, and must be removed after the volume initializes.
