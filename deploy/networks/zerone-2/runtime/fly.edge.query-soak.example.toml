# Pre-cutover query-origin soak. RPC and REST listen only on Fly private
# networking; this profile has no public service, IP, or external P2P address.
app = "replace-edge-app"
primary_region = "replace-region"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "replace-with-pinned-image-digest"

[deploy]
  strategy = "immediate"

[env]
  NODE_ROLE = "edge"
  ZERONE_HOME = "/data/.zeroned"
  MONIKER = "replace-edge-moniker"
  PERSISTENT_PEERS = "0000000000000000000000000000000000000000@[replace-private-validator-address]:26656"
  PRIVATE_PEER_IDS = "0000000000000000000000000000000000000000"
  CORS_ALLOWED_ORIGINS_JSON = "[]"
  QUERY_ORIGIN_ENABLED = "true"

[mounts]
  source = "replace_edge_volume"
  destination = "/data"

[[vm]]
  size = "replace-edge-vm-size"
  memory = "4gb"

# The private query gateway uses this exact state for its upstream smoke test.
# Public P2P is enabled only after OPEN-BETA and verified link-initiation evidence.
