# Private pre-cutover gateway soak. No public Fly service or IP.
app = "replace-zerone-2-query-gateway-app"
primary_region = "replace-region"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "replace-with-pinned-query-gateway-image-digest"

[env]
  GATEWAY_ROLE = "zerone-2-query"
  EXPECTED_CHAIN_ID = "zerone-2"
  UPSTREAM_HOST = "replace-zerone-2-edge-app.internal"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
