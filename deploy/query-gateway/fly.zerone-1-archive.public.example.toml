# OPEN-BETA-only public query gateway for the already-private, sanitized A/A
# archive origin; requires verified link-initiation evidence.
app = "replace-zerone-1-archive-gateway-app"
primary_region = "replace-region"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "replace-with-pinned-query-gateway-image-digest"

[env]
  GATEWAY_ROLE = "zerone-1-archive-query"
  EXPECTED_CHAIN_ID = "zerone-1"
  UPSTREAM_HOST = "replace-zerone-1-archive-app.internal"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [services.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/gateway-health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
