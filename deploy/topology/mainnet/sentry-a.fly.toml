# Non-signing mainnet sentry A. Replace every REPLACE_* value only after the
# public topology manifest and node identities have been independently reviewed.
app = "zerone-1-sentry-a"
primary_region = "lhr"

[build]
  image = "REPLACE_WITH_REGISTRY_IMAGE_AT_SHA256"

[env]
  ZERONE_HOME = "/data/.zeroned"
  ZERONE_NODE_ROLE = "sentry"
  ZERONE_MONIKER = "zerone-1-sentry-a"
  ZERONE_VALIDATOR_PEER = "REPLACE_WITH_40_LOWERCASE_HEX@replace-validator-private.example:26656"
  ZERONE_SENTRY_PEERS = "REPLACE_WITH_40_LOWERCASE_HEX@zerone-1-sentry-b.internal:26656"
  ZERONE_EXTERNAL_P2P_ADDRESS = "zerone-1-sentry-a.fly.dev:26656"
  ZERONE_TOPOLOGY_SHA256 = "REPLACE_WITH_64_LOWERCASE_HEX"

[mounts]
  source = "zerone_1_sentry_a_data_v1"
  destination = "/data"

[[restart]]
  # Fly Launch spelling; the resulting Machine API policy is "no".
  policy = "never"

[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 26656

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
