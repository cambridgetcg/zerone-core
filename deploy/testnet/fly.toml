# zerone-testnet-1 — transitional custodial validator on fly.io.
# No RPC/REST/gRPC service is published from the consensus-key machine.
app = "zerone-testnet-1"
primary_region = "lhr"

[build]
  # Build from the repository root with reviewed VERSION, full 40-hex COMMIT,
  # and SOURCE_DATE_EPOCH values supplied through repeated --build-arg flags.
  dockerfile = "deploy/testnet/Dockerfile"

[env]
  MONIKER = "zerone-testnet-fly-0"
  ZERONE_HOME = "/data/.zeroned"
  EXTERNAL_ADDRESS = "37.16.28.121:26656"

[mounts]
  source = "zerone_data"
  destination = "/data"

# P2P (26656) — raw TCP so other nodes can peer/sync.
[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 26656

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
