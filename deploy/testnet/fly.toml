# RETIRED: do not deploy this configuration. The intentionally invalid app
# name makes cached `fly deploy` commands fail before targeting the live legacy
# validator. See networks/zerone-testnet-1/README.md.
app = "__retired_zerone_testnet_1__"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  MONIKER = "zerone-testnet-fly-0"
  ZERONE_HOME = "/data/.zeroned"
  EXTERNAL_ADDRESS = "37.16.28.121:26656"

[mounts]
  source = "zerone_data"
  destination = "/data"

# P2P (26656) — raw TCP so other nodes can peer/sync.
[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 26656

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
