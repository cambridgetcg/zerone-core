# zerone-1 — transitional custodial validator on fly.io.
# No RPC/REST/gRPC service is published from the consensus-key machine.
app = "zerone-1"
primary_region = "lhr"

[build]
  # Build from the repository root with reviewed VERSION, full 40-hex COMMIT,
  # and SOURCE_DATE_EPOCH values supplied through repeated --build-arg flags.
  dockerfile = "deploy/mainnet/Dockerfile"

[env]
  MONIKER = "zerone-1-fly-0"
  ZERONE_HOME = "/data/.zeroned"
  EXTERNAL_ADDRESS = "169.155.55.44:26656"

[mounts]
  source = "zerone_data"
  destination = "/data"

[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 26656

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
