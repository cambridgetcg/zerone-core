# zerone-1 — transitional custodial validator on fly.io.
# No RPC/REST/gRPC service is published from the consensus-key machine.
app = "zerone-1"
primary_region = "lhr"

[build]
  # Fail closed: build locally through build-image.sh, publish/scan it, then
  # replace this with the exact registry digest. Never let Fly upload the repo.
  image = "REPLACE_WITH_PINNED_ZERONE_1_HALT_IMAGE_DIGEST"

[deploy]
  strategy = "immediate"

[env]
  MONIKER = "zerone-1-fly-0"
  NODE_ROLE = "signer"
  ZERONE_HOME = "/data/.zeroned"
  EXTERNAL_ADDRESS = "169.155.55.44:26656"

[mounts]
  source = "zerone_data"
  destination = "/data"

[[services]]
  internal_port = 26656
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 26656

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
