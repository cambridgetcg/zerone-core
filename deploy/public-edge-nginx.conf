# Read-only public edge for a non-signing Zerone query node.
#
# Fly terminates TLS and forwards HTTP to 8080. This policy deliberately has
# no generic proxy fallback: a route must be named below to become public.
worker_processes 1;
user www-data;
pid /tmp/zerone-public-edge-nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 15s;

    log_format bounded '$remote_addr "$request" $status $body_bytes_sent '
                       'request_time=$request_time';
    access_log /dev/stdout bounded;

    limit_req_zone $binary_remote_addr zone=zerone_query_rate:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=zerone_query_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream zerone_comet_rpc {
        server 127.0.0.1:26657;
        keepalive 8;
    }

    upstream zerone_rest {
        server 127.0.0.1:1317;
        keepalive 8;
    }

    server {
        listen 0.0.0.0:8080;
        server_name _;

        limit_req zone=zerone_query_rate burst=40 nodelay;
        limit_conn zerone_query_connections 20;

        # Fly's edge forwards browser reads here. Replace any upstream CORS
        # response with one canonical value so browsers never see "*, *".
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        # This is a query surface. Mutation and protocol-upgrade methods are
        # refused before either upstream sees a request.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "query-edge-ready\n";
        }

        # CometBFT transaction/evidence broadcast and peer-control methods.
        # The optional rpc/ prefix preserves the existing zerone-rpc client
        # contract without creating a generic pass-through to CometBFT.
        location ~ ^/(?:rpc/)?(broadcast_tx_async|broadcast_tx_sync|broadcast_tx_commit|broadcast_evidence|unsafe_[a-z0-9_]+|dial_peers|dial_seeds)(/|$) {
            return 403;
        }

        # Subscription and unbounded/search-style surfaces stay private.
        location ~ ^/(?:rpc/)?(subscribe|unsubscribe|unsubscribe_all|websocket|tx_search|block_search|unconfirmed_txs|num_unconfirmed_txs|dump_consensus_state|consensus_state)(/|$) {
            return 403;
        }

        # This feegrant endpoint scans grants issued by one granter and is not
        # safe as an unindexed public surface. Bounded grantee/grant reads remain.
        location ~ ^/(?:rest/)?cosmos/feegrant/v1beta1/issued(/|$) {
            return 403;
        }

        # The collection endpoint is also the REST transaction broadcast route.
        # Individual transaction reads under /txs/<hash> remain available.
        location ~ ^/(?:rest/)?cosmos/tx/v1beta1/txs/?$ {
            return 403;
        }

        # Compatibility surface used by the existing zerone-rpc endpoint.
        # Only a named RPC method reaches the upstream; the rewrite happens
        # after that method has passed the allowlist.
        location ~ ^/rpc/(health|status|net_info|abci_info|abci_query|block|block_by_hash|block_results|commit|validators|consensus_params|genesis|genesis_chunked|header|header_by_hash|tx)/?$ {
            rewrite ^/rpc(/.*)$ $1 break;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Request-ID $http_fly_request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_max_temp_file_size 0;
            proxy_pass http://zerone_comet_rpc;
        }

        # Explicit bounded CometBFT query allowlist.
        location ~ ^/(health|status|net_info|abci_info|abci_query|block|block_by_hash|block_results|commit|validators|consensus_params|genesis|genesis_chunked|header|header_by_hash|tx)/?$ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Request-ID $http_fly_request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_max_temp_file_size 0;
            proxy_pass http://zerone_comet_rpc;
        }

        # Prefix-compatible REST surface. As with RPC, the prefix is stripped
        # only after the first path segment has passed the namespace allowlist.
        location ~ ^/rest/(cosmos|cosmos_proto|ibc|ibc_apps|zerone)/ {
            rewrite ^/rest(/.*)$ $1 break;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Request-ID $http_fly_request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_max_temp_file_size 0;
            proxy_pass http://zerone_rest;
        }

        # Cosmos SDK and Zerone gRPC-gateway query routes. Methods are already
        # restricted to GET/HEAD, and the dangerous feegrant/tx collections are
        # denied above.
        location ~ ^/(cosmos|cosmos_proto|ibc|ibc_apps|zerone)/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Request-ID $http_fly_request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_max_temp_file_size 0;
            proxy_pass http://zerone_rest;
        }

        location / {
            return 404;
        }
    }
}
