name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25.12"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: make build

  lint:
    name: "Lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Lint
        run: make lint

  test:
    name: "Test"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: make test

  typescript-sdk:
    name: "TypeScript SDK and dashboard"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            dashboard/package-lock.json
      - name: Use declared npm release
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"
      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Regenerate SDK codecs
        working-directory: sdk/typescript
        run: npm run generate
      - name: Verify committed generated codecs
        run: test -z "$(git status --porcelain --untracked-files=all -- sdk/typescript/src/generated)"
      - name: Check SDK source and registry
        working-directory: sdk/typescript
        run: npm run check
      - name: Verify runtime dependency audit
        working-directory: sdk/typescript
        run: npm audit --omit=dev
      - name: Rebuild SDK distribution
        working-directory: sdk/typescript
        run: npm run build
      - name: Verify committed SDK distribution
        run: test -z "$(git status --porcelain --untracked-files=all -- sdk/typescript/dist)"
      - name: Verify packed SDK public exports
        working-directory: sdk/typescript
        run: npm run check:publish
      - name: Verify packed SDK leaves committed distribution unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- sdk/typescript/dist)"
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Verify dashboard dependency audit
        working-directory: dashboard
        run: npm audit
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  sigstore-compiler:
    name: "Sigstore substrate compiler"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/sigstore-substrate-compiler
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/sigstore-substrate-compiler/go.mod
          cache: true
          cache-dependency-path: tools/sigstore-substrate-compiler/go.sum
      - name: Verify selected toolchain
        run: test "$(go env GOVERSION)" = "go1.25.12"
      - name: Test, vet, and race-test
        run: |
          go test ./... -count=1
          go vet ./...
          go test -race ./... -count=1
      - name: Verify reproducible Linux build
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: linux
        run: |
          go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "$RUNNER_TEMP/compiler-a" .
          go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "$RUNNER_TEMP/compiler-b" .
          cmp "$RUNNER_TEMP/compiler-a" "$RUNNER_TEMP/compiler-b"
          sha256sum "$RUNNER_TEMP/compiler-a"

  chain-registry:
    name: "Chain Registry metadata"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Use declared npm release
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"
      - name: Verify metadata against Zerone source facts
        run: node scripts/check-chain-registry.mjs
      - name: Validate with the pinned upstream registry CLI
        run: scripts/validate-chain-registry.sh

  deployment-images:
    name: "Deployment image (${{ matrix.profile }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mainnet
            dockerfile: deploy/mainnet/Dockerfile
          - profile: testnet
            dockerfile: deploy/testnet/Dockerfile
          - profile: cosmovisor-validator
            dockerfile: Dockerfile.validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify secret-deny build-context rules
        run: |
          grep -Fxq '**/priv_validator_key.json' .dockerignore
          grep -Fxq '**/priv_validator_state.json' .dockerignore
          grep -Fxq '**/node_key.json' .dockerignore
          grep -Fxq '.env' .dockerignore
          grep -Fxq '.env.*' .dockerignore
      - name: Build from repository-root context
        env:
          CI_IMAGE_VERSION: v0.0.0-ci
        run: |
          ci_source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          docker build \
            --build-arg "VERSION=${CI_IMAGE_VERSION}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "SOURCE_DATE_EPOCH=${ci_source_date_epoch}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "zerone-${{ matrix.profile }}:ci" \
            .
          test "$(
            docker run --rm \
              --entrypoint /usr/local/bin/zeroned \
              "zerone-${{ matrix.profile }}:ci" version
          )" = "${CI_IMAGE_VERSION}"
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "zerone-${{ matrix.profile }}:ci"
          )" = "${GITHUB_SHA}"
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "zerone-${{ matrix.profile }}:ci"
          )" = "${CI_IMAGE_VERSION}"
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "io.zerone.source-date-epoch" }}' \
              "zerone-${{ matrix.profile }}:ci"
          )" = "${ci_source_date_epoch}"
      - name: Refuse embedded consensus or P2P key files
        run: |
          found="$(
            docker run --rm --entrypoint /bin/sh zerone-${{ matrix.profile }}:ci \
              -c 'find / -type f \( -name priv_validator_key.json -o -name priv_validator_state.json -o -name node_key.json \) -print 2>/dev/null'
          )"
          test -z "$found"
