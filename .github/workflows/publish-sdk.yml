name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to release (for example, 0.1.0)"
        required: true
        type: string

concurrency:
  group: npm-sdk-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: "Publish @zerone-chain/sdk"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-sdk-release
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use declared npm release
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Require Node 22.14.0 or later for trusted publishing
        # npm trusted publishing needs npm 11.5.1 or later (pinned above to
        # 11.19.0) and Node 22.14.0 or later. node-version "22" takes a 22.x
        # release from the runner's tool cache or the newest one; this step
        # stops the run if that is ever older than 22.14.0.
        run: |
          node --eval '
            const [major, minor] = process.versions.node.split(".").map(Number);
            process.exit(major > 22 || (major === 22 && minor >= 14) ? 0 : 1);
          '

      - name: Require an exact SDK tag at current main
        shell: bash
        env:
          CONFIRMED_VERSION: ${{ inputs.version }}
          # Read-only and scoped to this step. Checkout keeps no credentials;
          # while the repository was private (about 2026-09-25 to 2026-10-28)
          # an unauthenticated `git fetch origin main` could not read it. Later
          # steps that run package lifecycle scripts never receive this token.
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          version="$(node --print "require('./package.json').version")"
          test "$CONFIRMED_VERSION" = "$version"
          test "$GITHUB_REF_NAME" = "sdk-v${version}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}^{tag}")" = "tag"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test -n "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"

      - name: Require an existing package and a new version
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          encoded_name="$(
            node --input-type=module --eval '
              process.stdout.write(encodeURIComponent(process.argv[1]));
            ' "$package_name"
          )"
          registry_document="$RUNNER_TEMP/npm-registry-package.json"
          registry_status="$(
            curl --silent --show-error \
              --output "$registry_document" \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/${encoded_name}"
          )"

          case "$registry_status" in
            200)
              ;;
            404)
              # The package has been on npm since its owner published 0.1.1 by
              # hand with npm 2FA on 2026-11-02 (docs/standards/OPEN_CRYPTO_SDK.md).
              # A 404 now means the registry answered wrongly or the package is
              # gone, and staging would create a new package, so refuse.
              echo "::error::npm answered 404 for ${package_name}, which has been on npm since 0.1.1 (2026-11-02); refusing to infer release state"
              exit 1
              ;;
            *)
              echo "::error::npm registry returned HTTP ${registry_status}; refusing to infer release state"
              exit 1
              ;;
          esac

          # The registry's CDN can serve a cached document for a while, so a
          # version published moments ago may be missing here; npm still
          # refuses to stage a version that already exists.
          if node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const document = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.exit(
              Object.hasOwn(document.versions ?? {}, process.argv[2]) ? 0 : 1
            );
          ' "$registry_document" "$package_version"; then
            echo "::error::${package_name}@${package_version} already exists on npm"
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate SDK codecs
        run: npm run generate

      - name: Verify generated sources are unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- src/generated)"

      - name: Check SDK source and registry
        run: npm run check

      - name: Audit the published dependency graph
        run: npm audit --omit=dev

      - name: Rebuild SDK distribution
        run: npm run build

      - name: Verify distribution is unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Verify packed public exports
        run: npm run check:publish

      - name: Verify pack checks leave distribution unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Pack the exact release artifact
        id: pack
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/sdk-pack.json"
          tarball_name="$(
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const entries = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (entries.length !== 1 || !entries[0]?.filename) {
                throw new Error("npm pack did not report exactly one tarball");
              }
              process.stdout.write(entries[0].filename);
            ' "$RUNNER_TEMP/sdk-pack.json"
          )"
          tarball="$RUNNER_TEMP/$tarball_name"
          test -f "$tarball"
          pack_sha1="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const entries = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.stdout.write(entries[0].shasum);
          ' "$RUNNER_TEMP/sdk-pack.json")"
          pack_sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          pack_integrity="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const entries = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.stdout.write(entries[0].integrity);
          ' "$RUNNER_TEMP/sdk-pack.json")"
          {
            echo "tarball=$tarball"
            echo "sha1=$pack_sha1"
            echo "sha256=$pack_sha256"
            echo "integrity=$pack_integrity"
          } >> "$GITHUB_OUTPUT"

      - name: Stage the exact tarball with trusted publishing
        # No provenance option. From 2026-10-27 this step passed
        # --provenance=false, because the repository was private and npm could
        # not attest provenance from it. It has been public again since
        # 2026-10-28, and npm generates provenance by default for a public
        # package published through trusted publishing from a public
        # repository; package.json's publishConfig does not turn it off.
        # Confirm on the first staged release that the attestation appears.
        run: npm stage publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest

      - name: Record staged release identity
        shell: bash
        run: |
          {
            echo "### @zerone-chain/sdk staged for review"
            echo
            echo "This version is not public until a maintainer inspects the staged tarball and approves it with 2FA."
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tarball SHA-256: \`${{ steps.pack.outputs.sha256 }}\`"
            echo "- npm shasum: \`${{ steps.pack.outputs.sha1 }}\`"
            echo "- npm integrity: \`${{ steps.pack.outputs.integrity }}\`"
            echo "- Provenance: expected from npm for this trusted publish; after approval, confirm the version's \`dist.attestations\` on the registry"
          } >> "$GITHUB_STEP_SUMMARY"
