name: Publish TypeScript SDK

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: "Publish @zerone-chain/sdk"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-sdk-release
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use declared npm release
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"

      - name: Require an exact SDK tag at current main
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          version="$(node --print "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "sdk-v${version}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}^{tag}")" = "tag"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate SDK codecs
        run: npm run generate

      - name: Verify generated sources are unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- src/generated)"

      - name: Check SDK source and registry
        run: npm run check

      - name: Audit the published dependency graph
        run: npm audit --omit=dev

      - name: Rebuild SDK distribution
        run: npm run build

      - name: Verify distribution is unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Verify packed public exports
        run: npm run check:publish

      - name: Verify pack checks leave distribution unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Pack the exact release artifact
        id: pack
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/sdk-pack.json"
          tarball_name="$(
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const entries = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (entries.length !== 1 || !entries[0]?.filename) {
                throw new Error("npm pack did not report exactly one tarball");
              }
              process.stdout.write(entries[0].filename);
            ' "$RUNNER_TEMP/sdk-pack.json"
          )"
          tarball="$RUNNER_TEMP/$tarball_name"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Publish exact tarball
        env:
          # Bootstrap only: set this approval-environment secret to a
          # short-lived, scope-limited token. Remove it after npm trusted
          # publishing is configured for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest --provenance

      - name: Record published identity
        shell: bash
        run: |
          {
            echo "### @zerone-chain/sdk published"
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tarball SHA-256: \`${{ steps.pack.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
